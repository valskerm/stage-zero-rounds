name: Update league data

on:
  schedule:
    - cron: "0 6 * * *"    # every day 08:00 SAST
    - cron: "0 22 * * *"   # every day 00:00 SAST
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update league data"
          git push
